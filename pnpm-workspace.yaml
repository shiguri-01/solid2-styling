packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@lism-css/plugin": ^0.5.1
  "@pandacss/dev": ^2.4.0
  "@pandacss/eslint-plugin": ^2.4.0
  "@pandacss/preset-base": ^2.4.0
  "@pandacss/preset-panda": ^2.4.0
  "@pandacss/vite": ^2.4.0
  "@solidjs/vite-plugin": ^3.0.0-next.54
  "@stylexjs/eslint-plugin": ^0.19.1
  "@stylexjs/stylex": ^0.19.1
  "@stylexjs/unplugin": ^0.19.1
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@unocss/eslint-plugin": ^66.12.0
  "@vanilla-extract/css": ^1.21.3
  "@vanilla-extract/dynamic": ^2.1.5
  "@vanilla-extract/vite-plugin": ^5.2.6
  "@yak/eslint-plugin": ^2.0.0
  "@yak/solid": ^0.4.0
  cross-env: ^10.1.0
  lism-css: ^1.1.0
  portless: ^0.15.12
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  unocss: ^66.12.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  zyzz: ^0.0.43
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@solidjs/diagnostics@2.0.0-rc.20"
  - "@solidjs/signals@2.0.0-rc.20"
  - "@solidjs/web@2.0.0-rc.20"
  - solid-js@2.0.0-rc.20
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
