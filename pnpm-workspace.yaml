packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@pandacss/eslint-plugin": ^2.4.0
  "@stylexjs/eslint-plugin": ^0.19.1
  "@types/node": ^24
  "@unocss/eslint-plugin": ^66.12.0
  "@yak/eslint-plugin": ^2.0.0
  cross-env: ^10.1.0
  portless: ^0.15.12
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@solidjs/diagnostics@2.0.0-rc.20"
  - "@solidjs/signals@2.0.0-rc.20"
  - "@solidjs/vite-plugin@3.0.0-next.53"
  - "@solidjs/web@2.0.0-rc.20"
  - solid-js@2.0.0-rc.20
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
